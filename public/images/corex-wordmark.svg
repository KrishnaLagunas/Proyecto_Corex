  </defs>
  <g fill="url(#corexBlue)" stroke="none">
    <!-- C -->
    <path d="M30 35 h90 l-20 20 h-50 v60 h50 l20 20 h-90 z" />
    <!-- O -->
    <path d="M150 35 h100 v120 h-100 z" />
    <rect x="170" y="55" width="60" height="80" fill="#fff" opacity="0.0"/>
    <!-- R -->
    <path d="M280 35 h90 v55 h-60 l40 65 h-35 l-38 -65 h-17 z M310 55 h40 v25 h-40 z" />
    <!-- E -->
    <path d="M400 35 h100 l-20 20 h-60 v25 h55 l-18 18 h-37 v25 h60 l-22 22 h-78 z" />
    <!-- X base (two diagonals) -->
    <path d="M525 35 h35 l45 60 l-45 60 h-35 l45 -60 z" />
  </g>
  <!-- Facets overlays -->
  <g fill="url(#facetLight)" opacity="0.85">
