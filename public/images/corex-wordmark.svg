<svg xmlns="http://www.w3.org/2000/svg" width="640" height="170" viewBox="0 0 640 170" role="img" aria-label="Corex wordmark">
  <defs>
    <linearGradient id="corexBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F5BFF"/>
      <stop offset="100%" stop-color="#0F45F5"/>
    </linearGradient>
    <linearGradient id="facetLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EA1FF"/>
      <stop offset="100%" stop-color="#3E7CFF"/>
