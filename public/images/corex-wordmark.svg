    <polygon points="30,35 50,35 30,55" />
    <polygon points="120,35 120,55 100,55" />
    <polygon points="120,155 100,155 120,135" />
    <polygon points="30,155 50,155 30,135" />
    <!-- O facets -->
    <polygon points="150,35 170,35 150,55" />
    <polygon points="250,35 250,55 230,55" />
    <polygon points="150,155 170,155 150,135" />
    <polygon points="250,155 230,155 250,135" />
    <!-- R facets -->
    <polygon points="280,35 300,35 280,55" />
    <polygon points="370,35 370,55 350,55" />
    <polygon points="355,90 370,90 360,105" />
    <!-- E facets -->
    <polygon points="400,35 420,35 400,55" />
    <polygon points="500,35 500,55 480,55" />
    <polygon points="480,78 500,78 490,93" />
    <polygon points="500,155 480,155 500,135" />
    <!-- X facets -->
    <polygon points="525,35 545,35 525,55" />
    <polygon points="605,35 605,55 585,55" />
    <polygon points="610,95 595,110 610,125" />
    <polygon points="560,95 575,110 560,125" />
