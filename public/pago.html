<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página de Pago</title>
  <link href="/css/styles.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body text-center">
            <h3 class="mb-3">Resultado del Pago</h3>
            <div id="estado-pago" class="mb-4"></div>
            <button class="btn btn-outline-secondary" onclick="window.history.back()">
              <i class="bi bi-arrow-left"></i> Volver
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Bootstrap Icons se carga como CSS, no como script -->
  <script>
    // Lee ?estado=aprobado|pendiente|falla y muestra un mensaje
    const params = new URLSearchParams(window.location.search);
    const estado = (params.get('estado') || '').toLowerCase();
    const box = document.getElementById('estado-pago');
    let html = '<p class="text-muted">No se recibió estado de pago.</p>';
    if (estado === 'aprobado') {
      html = '<div class="alert alert-success"><i class="bi bi-check-circle-fill me-2"></i>Pago aprobado</div>';
    } else if (estado === 'pendiente') {
      html = '<div class="alert alert-warning"><i class="bi bi-hourglass-split me-2"></i>Pago pendiente</div>';
    } else if (estado === 'falla' || estado === 'rechazado' || estado === 'error') {
      html = '<div class="alert alert-danger"><i class="bi bi-x-circle-fill me-2"></i>Pago rechazado o fallido</div>';
    }
    box.innerHTML = html;
  </script>
</body>
</html>
