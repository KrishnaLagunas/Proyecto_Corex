<!DOCTYPE html>
<html>
<head>
    <title>Test Dashboard - ERP Municipal</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        button { padding: 10px 20px; margin: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f8f9fa; font-weight: bold; }
        .status { padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .status.pendiente { background: #fff3cd; color: #856404; }
        .status.en_proceso { background: #cce5ff; color: #004085; }
        .status.completado { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏛️ Test Dashboard - ERP Municipal</h1>
        
        <div>
            <button onclick="hacerLogin()">🔐 Hacer Login como Admin</button>
            <button onclick="cargarDashboard()">📊 Cargar Dashboard</button>
            <button onclick="limpiarStorage()">🗑️ Limpiar Storage</button>
        </div>
        
        <div id="resultado" class="result"></div>
        
        <div id="dashboard" style="display: none;">
            <h2>📈 Dashboard</h2>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 20px 0;">
                <div style="background: #e3f2fd; padding: 15px; border-radius: 8px; text-align: center;">
                    <h3>Total Trámites</h3>
                    <div id="total-tramites" style="font-size: 24px; font-weight: bold; color: #1976d2;">-</div>
                </div>
                <div style="background: #e8f5e8; padding: 15px; border-radius: 8px; text-align: center;">
                    <h3>Total Pagos</h3>
                    <div id="total-pagos" style="font-size: 24px; font-weight: bold; color: #388e3c;">-</div>
                </div>
                <div style="background: #fff3e0; padding: 15px; border-radius: 8px; text-align: center;">
                    <h3>Proyectos Activos</h3>
                    <div id="total-proyectos" style="font-size: 24px; font-weight: bold; color: #f57c00;">-</div>
                </div>
                <div style="background: #fce4ec; padding: 15px; border-radius: 8px; text-align: center;">
                    <h3>Total Usuarios</h3>
                    <div id="total-usuarios" style="font-size: 24px; font-weight: bold; color: #c2185b;">-</div>
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px;">
                <div>
                    <h3>📋 Trámites Recientes</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Tipo</th>
                                <th>Estado</th>
                                <th>Fecha</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-tramites">
                            <tr><td colspan="4" style="text-align: center; color: #666;">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>
                
                <div>
                    <h3>💰 Pagos Recientes</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Monto</th>
                                <th>Estado</th>
                                <th>Fecha</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-pagos">
                            <tr><td colspan="4" style="text-align: center; color: #666;">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const CONFIG = {
            API_URL: 'http://localhost:3000/api',
            TOKEN_NAME: 'token',
            USER_DATA: 'userData'
        };
        
        function mostrarResultado(mensaje, tipo = 'success') {
            const resultado = document.getElementById('resultado');
            resultado.className = `result ${tipo}`;
            resultado.innerHTML = mensaje;
        }
        
        function formatearFecha(fecha) {
            return new Date(fecha).toLocaleDateString('es-CL');
        }
        
        function formatearMoneda(monto) {
            return new Intl.NumberFormat('es-CL', {
                style: 'currency',
                currency: 'CLP'
            }).format(monto);
        }
        
        async function hacerLogin() {
            try {
                mostrarResultado('🔄 Iniciando sesión...', 'info');
                
                const response = await fetch(`${CONFIG.API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'admin@municipalidad.cl',
                        password: 'admin123'
                    })
                });
                
                const data = await response.json();
                console.log('Respuesta del login:', data);
                
                if (data.success) {
                    localStorage.setItem(CONFIG.TOKEN_NAME, data.token);
                    localStorage.setItem(CONFIG.USER_DATA, JSON.stringify(data.user));
                    
                    mostrarResultado(`✅ Login exitoso!<br>
                        👤 Usuario: ${data.user.nombre} ${data.user.apellido}<br>
                        🎭 Role: ${data.user.role}<br>
                        📧 Email: ${data.user.email}`, 'success');
                } else {
                    mostrarResultado(`❌ Error en login: ${data.message}`, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarResultado(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        async function cargarDashboard() {
            const token = localStorage.getItem(CONFIG.TOKEN_NAME);
            if (!token) {
                mostrarResultado('⚠️ Primero debes hacer login', 'error');
                return;
            }
            
            try {
                mostrarResultado('🔄 Cargando datos del dashboard...', 'info');
                
                // Cargar datos del dashboard
                const [resumenResponse, tramitesResponse, pagosResponse] = await Promise.all([
                    fetch(`${CONFIG.API_URL}/dashboard/resumen`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    }),
                    fetch(`${CONFIG.API_URL}/tramites?limit=5`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    }),
                    fetch(`${CONFIG.API_URL}/pagos?limit=5`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    })
                ]);
                
                const resumenData = await resumenResponse.json();
                const tramitesData = await tramitesResponse.json();
                const pagosData = await pagosResponse.json();
                
                console.log('Datos del resumen:', resumenData);
                console.log('Datos de trámites:', tramitesData);
                console.log('Datos de pagos:', pagosData);
                
                // Mostrar dashboard
                document.getElementById('dashboard').style.display = 'block';
                
                // Actualizar contadores
                if (resumenData.success) {
                    document.getElementById('total-tramites').textContent = resumenData.data?.totalTramites || 0;
                    document.getElementById('total-pagos').textContent = formatearMoneda(resumenData.data?.totalPagos || 0);
                    document.getElementById('total-proyectos').textContent = resumenData.data?.proyectosActivos || 0;
                    document.getElementById('total-usuarios').textContent = resumenData.data?.totalUsuarios || 0;
                }
                
                // Actualizar tabla de trámites
                const tablaTramites = document.getElementById('tabla-tramites');
                if (tramitesData.success && tramitesData.tramites && tramitesData.tramites.length > 0) {
                    tablaTramites.innerHTML = tramitesData.tramites.map(tramite => `
                        <tr>
                            <td>${tramite.codigo || 'N/A'}</td>
                            <td>${tramite.tipo || 'N/A'}</td>
                            <td><span class="status ${tramite.estado}">${tramite.estado}</span></td>
                            <td>${formatearFecha(tramite.fecha_solicitud)}</td>
                        </tr>
                    `).join('');
                } else {
                    tablaTramites.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #666;">No hay trámites recientes</td></tr>';
                }
                
                // Actualizar tabla de pagos
                const tablaPagos = document.getElementById('tabla-pagos');
                if (pagosData.success && pagosData.pagos && pagosData.pagos.length > 0) {
                    tablaPagos.innerHTML = pagosData.pagos.map(pago => `
                        <tr>
                            <td>${pago.codigo || 'N/A'}</td>
                            <td>${formatearMoneda(pago.monto)}</td>
                            <td><span class="status ${pago.estado}">${pago.estado}</span></td>
                            <td>${formatearFecha(pago.fecha_pago)}</td>
                        </tr>
                    `).join('');
                } else {
                    tablaPagos.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #666;">No hay pagos recientes</td></tr>';
                }
                
                mostrarResultado('✅ Dashboard cargado exitosamente!', 'success');
                
            } catch (error) {
                console.error('Error:', error);
                mostrarResultado(`❌ Error al cargar dashboard: ${error.message}`, 'error');
            }
        }
        
        function limpiarStorage() {
            localStorage.clear();
            document.getElementById('dashboard').style.display = 'none';
            mostrarResultado('🗑️ Storage limpiado', 'success');
        }
        
        // Auto-cargar si ya hay token
        window.addEventListener('load', () => {
            const token = localStorage.getItem(CONFIG.TOKEN_NAME);
            if (token) {
                mostrarResultado('ℹ️ Token encontrado. Puedes cargar el dashboard directamente.', 'info');
            }
        });
    </script>
</body>
</html>
